<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>

<body>
    <div class="container">
        <di class="row gap-1">
            <div class=" col bg-secondary">C1</div>
            <div class=" col bg-secondary">C2</div>
            <div class=" col bg-secondary">C3</div>
            <div class=" col bg-secondary">C4</div>
            <div class=" col bg-secondary">C5</div>
            <div class=" col bg-secondary">C6</div>
            <div class=" col bg-secondary">C7</div>
            <div class=" col bg-secondary">C8</div>
            <div class=" col bg-secondary">C9</div>
            <div class=" col bg-secondary">C10</div>
            <div class=" col bg-secondary">C11</div>
            <div class=" col bg-secondary">C12</div>
        </di>
        <div class="row gap-1 mt-3">
            <div class="col bg-info">Partie 1</div>
            <div class="col">
                <img src="img/grab-a-coffee.jpg" alt="" class="border border-danger w-100">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col d-flex flex-column gap-1">
                <h3>Les styles de boutton Bootstrap</h3>
                <button type="button" class="btn btn-primary">Primary</button>
                <button type="button" class="btn btn-secondary">Secondary</button>
                <button type="button" class="btn btn-success">Success</button>
                <button type="button" class="btn btn-danger">Danger</button>
                <button type="button" class="btn btn-warning">Warning</button>
                <button type="button" class="btn btn-info">Info</button>
                <button type="button" class="btn btn-light">Light</button>
                <button type="button" class="btn btn-dark">Dark</button>
                <button type="button" class="btn btn-link">Link</button>
            </div>
            <div class="col bg-secondary"></div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="../js/script.js"></script>
</body>

</html>
