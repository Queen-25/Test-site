<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function lireAnnee() {
            var annee = prompt("En quel annee sommes-nous ?");
            alert("Nous sommes en " + annee);
        }
    </script>
</head>
<body>
    <input type="button" value="Lire l'année" onclick="lireAnnee()">
</body>
</html>
