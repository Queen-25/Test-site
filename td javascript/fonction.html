<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Fonction pour calculer le volume d'un cylindre
        function volumecylindre(r,h){
            var volume = 3.14 * r * r * h;
            return volume;
        }
    </script>
</head>
<body>
    <script>
        var rayon = 5;
        var hauteur = 10;
        var volume = volumecylindre(rayon, hauteur);
        document.write("Le volume du cylindre est: " + volume);
        // Exemple d'appel de la fonction avec des valeurs différentes
    </script>
</body>
</html>
