<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Exemple de tableau d'objets représentant des étudiants
        var etudiants = [
            { nom: "Alice", age: 20 },
            { nom: "Bob", age: 22 },
            { nom: "Charlie", age: 19 }
        ];
        for (var i = 0; i < etudiants.length; i++) {
            document.write("Nom: " + etudiants[i].nom + ", Age: " + etudiants[i].age + "<br>");
        }
    </script>
</body>
</html>
