<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <script>
            //les caracterisques du navigateur actuel
            var nomNavigateur = navigator.appName;
            var versionNavigateur = navigator.appVersion;
            var platformNavigateur = navigator.platform;
            document.write(`les caracterisques du navigateur actuel sont : <br> 
            nom: ${nomNavigateur} <br>
            version: ${versionNavigateur} <br> 
            platform: ${platformNavigateur}`);
           
        </script>

</body>
</html>
